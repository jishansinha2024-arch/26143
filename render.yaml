services:
  - type: web
    name: varuna-netra
    runtime: docker
    plan: starter        # free (512 MB) will likely run out of memory with pandas/scipy/opencv
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: MONGO_URL           # MongoDB Atlas SRV connection string
        sync: false
      - key: DB_NAME
        value: varuna_netra
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_MODE           # "true" seeds labelled demo data; set "false" for a clean production DB
        value: "true"
      - key: DEMO_SUPERVISOR_EMAIL
        value: supervisor@varuna.example
      - key: DEMO_ANALYST_EMAIL
        value: analyst@varuna.example
      - key: DEMO_SUPERVISOR_PASSWORD
        generateValue: true
      - key: DEMO_ANALYST_PASSWORD
        generateValue: true
      - key: WEBHOOK_CRON_SECRET
        generateValue: true
